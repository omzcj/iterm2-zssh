name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - Makefile
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: omzcj/release-ci/.github/workflows/source-release.yml@9e6c5af26117fd344905d93a0e16be0bbf4e62c5
    with:
      runner: macos-15-intel
      project-name: iterm2-zssh
      validate-command: make build && bash -n bin/iterm2-recv-zmodem && bash -n bin/iterm2-send-zmodem
      package-paths: |
        VERSION
        LICENSE
        Makefile
        src
